name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --info --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DramaFy-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build and Sign Release APK
      run: |
        mkdir -p /tmp/keystore
        keytool -genkeypair -v -storetype PKCS12 \
          -keystore /tmp/keystore/release.keystore \
          -alias dramafy \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=SanzzAza, OU=DramaFy, O=DramaFy, L=Jakarta, S=Jakarta, C=ID"

        ./gradlew assembleRelease --info --stacktrace

        cp app/build/outputs/apk/release/app-release-unsigned.apk \
           app/build/outputs/apk/release/app-release.apk

        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore /tmp/keystore/release.keystore \
          -storepass android \
          -keypass android \
          app/build/outputs/apk/release/app-release.apk \
          dramafy

        ls -la app/build/outputs/apk/release/

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: DramaFy-release-signed
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        name: DramaFy Build ${{ github.run_number }}
        tag: build-${{ github.run_number }}
        body: |
          DramaFy Short Drama App
          - Build: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        artifacts: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        allowUpdates: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
        token: ${{ secrets.GITHUB_TOKEN }}
