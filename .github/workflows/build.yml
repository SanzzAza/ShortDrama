name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --info --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DramaFy-debug-signed
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Generate signing key
      run: |
        mkdir -p $HOME/.android
        keytool -genkeypair -v -storetype PKCS12 -keystore $HOME/.android/release.keystore -alias dramafy -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SanzzAza, OU=DramaFy, O=DramaFy, L=Jakarta, S=Jakarta, C=ID"

    - name: Build Signed Release APK
      env:
        KEYSTORE_PATH: $HOME/.android/release.keystore
        KEYSTORE_PASSWORD: android
        KEY_ALIAS: dramafy
        KEY_PASSWORD: android
      run: |
        ./gradlew assembleRelease --info --stacktrace
        # Sign the release APK
        cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore $KEYSTORE_PATH -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD app/build/outputs/apk/release/app-release.apk $KEY_ALIAS

    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: DramaFy-release-signed
        path: app/build/outputs/apk/release/app-release.apk

    - name: Auto Release on Push
      uses: softprops/action-gh-release@v1
      with:
        name: DramaFy v${{ github.run_number }}
        tag_name: v${{ github.run_number }}
        body: |
          🎬 DramaFy Short Drama App
          
          **Build #${{ github.run_number }}**
          - Commit: ${{ github.sha }}
          - Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ---
          ⚠️ Use **app-debug.apk** for testing (auto-signed)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
